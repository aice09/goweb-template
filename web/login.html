<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="description" content="Sign in to Fast CRUD">
  <title>Sign in · Fast CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link href="/assets/app.css" rel="stylesheet">
</head>
<body>
<main class="container py-5 login-container">
  <div class="text-center mb-4"><i class="fa-solid fa-layer-group fa-2x text-primary"></i><h1 class="h3 mt-3">Fast CRUD</h1><p class="text-secondary">Administrator sign in</p></div>
  <div id="notice" class="alert d-none" role="status"></div>
  <div class="card"><div class="card-body p-4">
    <form id="login-form">
      <div class="mb-3"><label for="username" class="form-label">Username</label><input class="form-control" id="username" autocomplete="username" required></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" id="submit" type="submit">Sign in</button>
    </form>
  </div></div>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/login.js"></script>
</body></html>
