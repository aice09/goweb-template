# Replace repoURL and targetRevision with your Git repository and protected branch/tag.
# Keep secrets outside Git; use External Secrets Operator, Sealed Secrets, or SOPS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fast-crud-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fast-crud
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/fast-crud-pro.git
    targetRevision: main
    path: deploy/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: fast-crud-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
