apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fast-crud-dev
resources:
  - ../../base
images:
  - name: ghcr.io/YOUR_ORG/fast-crud
    newName: ghcr.io/YOUR_ORG/fast-crud
    newTag: dev-REPLACE_WITH_IMMUTABLE_TAG
patches:
  - target:
      kind: Namespace
      name: fast-crud
    patch: |-
      - op: replace
        path: /metadata/name
        value: fast-crud-dev
  - target:
      kind: ConfigMap
      name: fast-crud-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
      - op: replace
        path: /data/TRUSTED_ORIGINS
        value: https://crud-dev.example.com
