apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-crud-config
  namespace: fast-crud
data:
  APP_ENV: "production"
  APP_NAME: "Fast CRUD"
  HTTP_ADDR: ":3000"
  TRUSTED_ORIGINS: "https://crud.example.com"
  LOG_LEVEL: "info"
  DB_MAX_CONNS: "20"
  DB_MIN_CONNS: "2"
  REDIS_ADDR: "redis.example.internal:6379"
  REDIS_DB: "0"
  CACHE_TTL: "60s"
  NATS_URL: "tls://nats.example.internal:4222"
  NATS_STREAM: "FASTCRUD_EVENTS"
  NATS_SUBJECT_PREFIX: "items"
  NATS_MAX_AGE: "168h"
  NATS_REPLICAS: "3"
  AUTH_MODE: "local"
  COOKIE_SECURE: "true"
  SESSION_TTL: "12h"
  SESSION_IDLE_TTL: "30m"
  CSP_ENABLED: "true"
  CSP_REPORT_ONLY: "false"
  CSP_FRAME_ANCESTORS: "'none'"
  CSP_CONNECT_SRC: "'self'"
  CSP_IMG_SRC: "'self' data: blob:"
  CSP_STYLE_SRC: "'self'"
  CSP_SCRIPT_SRC: "'self'"
  CSP_FONT_SRC: "'self' data:"
  HSTS_ENABLED: "true"
  HSTS_MAX_AGE: "31536000"
  REFERRER_POLICY: "no-referrer"
  PERMISSIONS_POLICY: "camera=(), microphone=(), geolocation=()"
  AUDIT_ENABLED: "true"
  AUDIT_RETENTION_DAYS: "365"
  S3_ENABLED: "false"
  S3_ENDPOINT: "s3.amazonaws.com"
  S3_REGION: "ap-southeast-1"
  S3_BUCKET: "fast-crud-files"
  S3_USE_SSL: "true"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  EMAIL_FROM: "fast-crud@example.com"
  EMAIL_NOTIFY_TO: ""
  BACKUP_ENABLED: "true"
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_ENCRYPTION_ENABLED: "true"
  BACKUP_VERIFY_AFTER_UPLOAD: "true"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "fast-crud"
