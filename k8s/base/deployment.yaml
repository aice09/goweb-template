apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-crud
  namespace: fast-crud
  labels:
    app.kubernetes.io/name: fast-crud
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fast-crud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fast-crud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/fast-crud:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: fast-crud-config
            - secretRef:
                name: fast-crud-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fast-crud-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: fast-crud-secrets
                  key: SESSION_SECRET
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fast-crud-secrets
                  key: SETUP_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
