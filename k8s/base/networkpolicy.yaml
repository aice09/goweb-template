apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fast-crud-default-deny-ingress
  namespace: fast-crud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fast-crud
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
