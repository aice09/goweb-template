apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fast-crud
  namespace: fast-crud
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crud.example.com
      secretName: fast-crud-tls
  rules:
    - host: crud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fast-crud
                port:
                  number: 80
